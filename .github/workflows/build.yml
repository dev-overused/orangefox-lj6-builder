name: Build OrangeFox Recovery for TECNO-LJ6 (HiOS 16)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build OrangeFox
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Free up disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 repo wget

      - name: Prepare Magisk zip for OrangeFox addon
        run: |
          mkdir -p ~/Magisk
          wget -q https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk -O ~/Magisk/Magisk-v28.1.zip
          ls -l ~/Magisk/Magisk-v28.1.zip

      - name: Configure Git & Sync OrangeFox fox_12.1
        run: |
          git config --global user.name "Builder"
          git config --global user.email "builder@example.com"
          git config --global color.ui false
          # Branch fox_12.1 is no longer in the OrangeFox manifests; the official
          # sync script inits the twrp-12.1 minimal manifest, patches it and clones
          # OrangeFox bootable/recovery + vendor/recovery itself.
          # NOTE: the script looks for patches/ relative to $PWD, so clone the
          # whole sync repo and run it from there (do NOT run it from /tmp).
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git "$HOME/fox-sync"
          cd "$HOME/fox-sync"
          ./orangefox_sync.sh --branch 12.1 --path "$HOME/ofox"
          ls -l ~/ofox/bootable/recovery ~/ofox/vendor/recovery

      - name: Clone Device & Common Trees
        run: |
          cd ~/ofox
          git clone -b fox_12.1-tranos16 https://github.com/Nade-is-not-a-dev/ofrp-device-tecno_TECNO-LJ6.git device/tecno/TECNO-LJ6
          git clone -b fox_12.1-tranos15 https://github.com/transsion-mt6789-recovery/twrp-device_transsion_mt6789-common.git device/transsion/mt6789-common

      - name: Patch device vendorsetup.sh (guard gflags clone)
        run: |
          cd ~/ofox
          sed -i 's|git clone https://android.googlesource.com/platform/external/gflags/ -b android-12.1.0_r4 external/gflags|if [ ! -d external/gflags ]; then git clone https://android.googlesource.com/platform/external/gflags/ -b android-12.1.0_r4 external/gflags; fi|' device/tecno/TECNO-LJ6/vendorsetup.sh
          grep -n "gflags" device/tecno/TECNO-LJ6/vendorsetup.sh

      - name: Compile OrangeFox vendor_boot.img & Zip
        run: |
          set +e
          cd ~/ofox
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=LJ6
          export LC_ALL="C"
          source build/envsetup.sh || { echo "!! envsetup FAILED (rc=$?)"; exit 1; }
          echo "== envsetup OK =="
          lunch twrp_LJ6-eng || { echo "!! lunch FAILED (rc=$?)"; exit 1; }
          echo "== lunch OK =="
          mka adbd vendorbootimage || { echo "!! BUILD FAILED (rc=$?)"; exit 1; }

      - name: Copy artifacts to workspace
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifacts
          cp -v ~/ofox/out/target/product/LJ6/vendor_boot.img $GITHUB_WORKSPACE/artifacts/ || true
          cp -v ~/ofox/out/target/product/LJ6/OrangeFox*.zip $GITHUB_WORKSPACE/artifacts/ || true
          ls -l $GITHUB_WORKSPACE/artifacts

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-TECNO-LJ6-HiOS16
          path: |
            artifacts/vendor_boot.img
            artifacts/OrangeFox*.zip
          if-no-files-found: warn
